buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'
jarJar.enable()

group = mod_group_id
version = mod_version

// Keep generated classes off cloud-synced Documents folders. Override for CI if needed.
layout.buildDirectory = file(providers.gradleProperty('divinityBuildDir').getOrElse(
        new File(gradle.gradleUserHomeDir, 'workspace-builds/divinity-engine/forge-1.20.1').absolutePath))

if (JavaVersion.current() != JavaVersion.VERSION_17) {
    throw new GradleException('Divinity Engine requires Java 17 to run Gradle. Set JAVA_HOME to a JDK 17 installation.')
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")


    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            if (providers.gradleProperty('devUsername').isPresent()) {
                args '--username', providers.gradleProperty('devUsername').get()
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory new File(gradle.gradleUserHomeDir, providers.gradleProperty('gameTestNamespaces')
                    .map { it == 'divinity_effects' ? 'workspace-runs/divinity-effects-gametest' :
                            it == 'divinity_content' ? 'workspace-runs/divinity-content-gametest' :
                            it == 'divinity_content_kubejs' ? 'workspace-runs/divinity-content-kubejs-gametest' :
                            it == 'divinity_statue_persistence' ? 'workspace-runs/divinity-statue-gametest' :
                            it == 'divinity_elder_retirement' ? 'workspace-runs/divinity-elder-retirement-gametest' :
                            it == 'divinity_pocket_domain' ? 'workspace-runs/divinity-pocket-domain-gametest' :
                            it == 'divinity_inner_world' ? 'workspace-runs/divinity-inner-world-gametest' :
                            it == 'divinity_menu_actions' ? 'workspace-runs/divinity-menu-actions-gametest' :
                            it == 'divinity_relationship' ? 'workspace-runs/divinity-relationship-gametest' :
                            it == 'divinity_relationship,divinity_quest_favor,divinity_menu_actions' ? 'workspace-runs/divinity-elder-integration-gametest' :
                            it == 'divinity_trial_recovery' ? 'workspace-runs/divinity-trial-recovery-gametest' :
                                    'workspace-runs/divinity-narrative-gametest' }
                    .getOrElse('workspace-runs/divinity-narrative-gametest'))
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(mod_id)
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file(providers.gradleProperty('dataOutputDir').getOrElse('src/generated/resources/')), '--existing', file('src/main/resources/')
            args '--existing-mod', 'vanguards_kit'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.latvian.dev/releases'; content { includeGroup 'dev.latvian.mods' } }
    maven { url = 'https://maven.architectury.dev'; content { includeGroup 'dev.architectury' } }
    mavenLocal {
        content { includeGroup 'net.nightshade' }
    }
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url = "https://jitpack.io"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository) // Only add this if you're using ForgeGradle, otherwise remove this line
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.26')
    compileOnly fg.deobf('dev.latvian.mods:rhino-forge:2001.2.2-build.17')
    compileOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')
    if (providers.gradleProperty('withKubeJS').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.26')
        runtimeOnly fg.deobf('dev.latvian.mods:rhino-forge:2001.2.2-build.17')
        runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")
    compileOnly fg.deobf("net.nightshade:vanguard-forge-1.20.1:${vanguard_version}")
    compileOnly fg.deobf("net.nightshade:nightshade_core-forge-1.20.1:${ns_core}")
    // Development runs do not load dependencies out of the release JarJar artifact.
    runtimeOnly fg.deobf("net.nightshade:vanguard-forge-1.20.1:${vanguard_version}")
    runtimeOnly fg.deobf("net.nightshade:nightshade_core-forge-1.20.1:${ns_core}")
    // Keep runtime remapping separate: nested release jars must remain reobfuscated.
    jarJar("net.nightshade:vanguard-forge-1.20.1:${vanguard_version}") {
        transitive = false
        jarJar.ranged(it, "[${vanguard_version},2.3)")
    }
    jarJar("net.nightshade:nightshade_core-forge-1.20.1:${ns_core}") {
        transitive = false
        jarJar.ranged(it, "[${ns_core},1.7)")
    }
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    jarJar("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}") {
        transitive = false
        jarJar.ranged(it, '[1.0.2-rc1,1.1)')
    }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json", 'Implementation-Version': project.version)
    finalizedBy 'reobfJarJar'
}
reobf { jarJar {} }
tasks.named('build').configure { dependsOn 'jarJar' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Pure story checks run without a Minecraft client or a loaded save.
def narrativeChecks = tasks.register('compileNarrativeChecks', JavaCompile) {
    source fileTree('src/main/java/net/nightshade/divinity_engine/util/divinity/narrative') {
        include 'NarrativeProgress.java', 'BuiltinNarrativeCatalog.java', 'DonationPlan.java'
    }
    source 'src/test/java/net/nightshade/divinity_engine/narrative/NarrativeStateMachineChecks.java'
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/narrativeChecks')
    options.release = 17
}
tasks.register('narrativeChecks', JavaExec) {
    group = 'verification'
    description = 'Checks all 36 story transitions, permanent choices, and reward idempotence.'
    dependsOn narrativeChecks
    classpath = files(narrativeChecks.map { it.destinationDirectory })
    mainClass = 'net.nightshade.divinity_engine.narrative.NarrativeStateMachineChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.register('compileNarrativeAddonExample', JavaCompile) {
    group = 'verification'
    description = 'Compiles the addon example against the public narrative API.'
    dependsOn 'compileJava'
    source fileTree('examples/living-pantheon-addon') { include '**/*.java' }
    source fileTree('examples/connected-pantheon-addon') { include 'ConnectedPantheonAddon.java', 'StarChartEvents.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/narrativeAddonExample')
    options.release = 17
}
tasks.named('check').configure { dependsOn 'narrativeChecks', 'compileNarrativeAddonExample' }

apply from: 'gradle/verify-bundled-mods.gradle'
apply from: 'gradle/verify-connected-pantheon.gradle'
tasks.named('check').configure { dependsOn 'connectedPantheonChecks' }

tasks.register('compileInnerWorldAddonExample', JavaCompile) {
    group = 'verification'
    description = 'Compiles the standalone Inner World addon against the public API.'
    dependsOn 'compileJava'
    source fileTree('examples/inner-world-addon/src/main/java') { include '**/*.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/innerWorldAddonExample')
    options.release = 17
}
tasks.register('innerWorldAddonJar', Jar) {
    group = 'verification'
    dependsOn 'compileInnerWorldAddonExample'
    archiveBaseName = 'communion-example'
    archiveVersion = '1.0.0'
    from tasks.named('compileInnerWorldAddonExample').map { it.destinationDirectory }
    from 'examples/inner-world-addon/src/main/resources'
    doFirst { manifest.attributes.remove('MixinConfigs') }
}
reobf { innerWorldAddonJar {} }
tasks.named('innerWorldAddonJar').configure { finalizedBy 'reobfInnerWorldAddonJar' }
